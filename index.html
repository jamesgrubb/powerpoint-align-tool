<div class="section-title"><h2>Equal spacing</h2><span>02</span></div><section class="tools-section" aria-label="Equal spacing"><div id="spacing" class="spacing-grid"><button class="tool" data-align="distributeX" aria-label="Distribute equal horizontal gaps" title="Horizontal"><span class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4v16M21 4v16M7 12h2m6 0h2"/><rect x="10" y="6" width="4" height="12" rx="1"/></svg></span><span class="tool-label">Horizontal</span><span class="keycaps" data-shortcut="distributeX"></span></button><button class="tool" data-align="distributeY" aria-label="Distribute equal vertical gaps" title="Vertical"><span class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16M4 21h16M12 7v2m0 6v2"/><rect x="6" y="10" width="12" height="4" rx="1"/></svg></span><span class="tool-label">Vertical</span><span class="keycaps" data-shortcut="distributeY"></span></button></div><p class="section-note">Three or more objects. Outer positions stay fixed.</p></section>
